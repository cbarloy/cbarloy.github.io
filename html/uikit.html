<!doctype html>
<html lang="$if(lang)$$lang$$else$en$endif$">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#101a2b">
  <title>$if(title)$$title$ · $endif$Academic website</title>
  $if(description)$<meta name="description" content="$description$">$endif$
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/site.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="reading-progress" aria-hidden="true"><span></span></div>

  <header class="site-header">
    <a class="wordmark" href="#top" aria-label="Back to top">CB<span>.</span></a>
    <nav class="header-links" aria-label="Quick links">
      <a href="mailto:corentin.barloy@irisa.fr">Email</a>
      <a href="pdfs/cv.pdf">CV</a>
      <button class="theme-toggle" type="button" aria-label="Switch color theme" title="Switch color theme">
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"/></svg>
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/></svg>
      </button>
    </nav>
  </header>

  <div id="top" class="hero">
    <div class="hero-pattern" aria-hidden="true"></div>
    <p class="eyebrow">Theoretical computer science</p>
    <h1>$title$</h1>
    $if(subtitle)$<p class="subtitle">$subtitle$</p>$endif$
    <p class="hero-note">Research & teaching at Université de Rennes</p>
  </div>

  <div class="page-shell">
    $if(toc)$
    <aside class="sidebar">
      <div class="toc-wrap">
        <p class="toc-label">On this page</p>
        <nav id="$idprefix$TOC" aria-label="Table of contents">
          $toc$
        </nav>
      </div>
    </aside>
    $endif$

    <main id="content" class="content">
      $body$
    </main>
  </div>

  <footer>
    <p>Corentin Barloy · Université de Rennes · LogicA / IRISA</p>
    <a href="#top">Back to top <span aria-hidden="true">↑</span></a>
  </footer>
  <script src="js/site.js"></script>
</body>
</html>
